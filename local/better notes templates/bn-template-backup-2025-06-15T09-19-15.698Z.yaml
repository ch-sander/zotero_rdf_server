-
    name: '[item]New Template: 1749811659483'
    text: "// @use-markdown\r\n// @use-refresh\r\n\r\n\r\n<pre>\r\nNote for ${topItem.getField(\"title\")}\r\n</pre>\r\n\r\n# lib 1 "
-
    name: '[item]Generate overview from annotations (by brackets tag)'
    text: "${\n    // This script organizes and displays annotations from your Zotero items.\n    //\n    // Annotation Formatting:\n    // - Use comments in your annotations to label sections.\n    // - Example: `[Introduction] This is an important point...`\n    // - Annotations without a label will be categorized under \"Unlabeled.\"\n    //\n    // Run the script in your Zotero environment to generate a structured HTML\n    // output with your annotations neatly organized.\n    await(async () => {\n        // Helper function to get author display names\n        const getAuthorDisplay = (creators) => {\n            let authorDisplay = [\"\", \"\"];\n            if (creators.length > 0) {\n                authorDisplay[0] = creators.length > 1 ? `${creators[0].lastName} et al.` : `${creators[0].lastName} ${creators[0].firstName}`;\n                authorDisplay[1] = creators.length > 7\n                    ? creators.slice(0, 7).map((v) => `${v.firstName} ${v.lastName}`).join(\"; \") + \"; et al.\"\n                    : creators.map((v) => `${v.firstName} ${v.lastName}`).join(\"; \");\n            }\n            return authorDisplay;\n        };\n\n        // Helper function to generate hyperlinks to annotations\n        const createAnnotationLink = (attachment, annoItem, text) => {\n            return `<a href=\"zotero://open-pdf/0_${attachment.key}?annotation=${annoItem.key}\">${text || 'Annotation'}</a>`;\n        };\n\n        // Function to organize annotations by sections\n        const getAnnotationsBySection = async (_item) => {\n            let annots = await _item.getAnnotations();\n            let sectionedAnnotations = {};\n\n            for (let annoItem of annots) {\n                let content = (await Zotero.Annotations.toJSON(annoItem)).text || '';\n                let comment = annoItem.annotationComment || '';\n\n                let annotationHTML = \"\";\n                if ([\"image\", \"ink\"].includes(annoItem.annotationType)) {\n                    annotationHTML += `<blockquote>${await Zotero.BetterNotes.api.convert.annotations2html([annoItem], { noteItem: targetNoteItem, ignoreComment: true })}</blockquote>`;\n                } else if ([\"note\", \"text\", \"highlight\", \"underline\"].includes(annoItem.annotationType)) {\n                    annotationHTML += content ? `<blockquote>${content}</blockquote>` : '';\n                }\n\n                // Proceed only if annotationHTML has been created and not empty\n                if (annotationHTML || comment) {\n                    // Use regex to parse section label and comment content\n                    let parsed = comment.match(/^\\[(.*?)\\](.*)/);\n                    let sectionLabel = parsed ? parsed[1].trim() : \"Unlabeled\";\n                    let sectionComment = parsed ? parsed[2].trim() : comment;\n\n                    // Initialize the section if it doesn't exist\n                    if (!sectionedAnnotations[sectionLabel]) {\n                        sectionedAnnotations[sectionLabel] = [];\n                    }\n\n                    if (content) {\n                        // Adding hyperlink to the quote if content exists\n                        sectionedAnnotations[sectionLabel].push(\n                            `<blockquote>${content}<br><b>${createAnnotationLink(_item, annoItem, \"Link\")}</b></blockquote>` +\n                            `<p>${sectionComment}</p>`\n                        );\n                    } else if (annoItem.annotationType === \"image\") {\n                        // Adding comment for images or sections without a quote\n                        sectionedAnnotations[sectionLabel].push(\n                            annotationHTML + `<p>${sectionComment}</p>`\n                        );\n                    } else {\n                        // Adding hyperlink to other annotations\n                        sectionedAnnotations[sectionLabel].push(\n                            annotationHTML + `<p>${createAnnotationLink(_item, annoItem, sectionComment)}</p>`\n                        );\n                    }\n                }\n            }\n            // Separate \"Unlabeled\" annotations and sort others\n            let sortedAnnotations = { ...sectionedAnnotations };\n            let unlabeledAnnotations = sortedAnnotations[\"Unlabeled\"];\n            delete sortedAnnotations[\"Unlabeled\"];\n\n            if (unlabeledAnnotations && unlabeledAnnotations.length > 0) {\n                sortedAnnotations[\"Unlabeled\"] = unlabeledAnnotations;\n            }\n\n            return sortedAnnotations;\n        };\n\n        let creators = topItem.getCreators();\n        let authorDisplay = getAuthorDisplay(creators);\n\n        let annotationsCollection = {};\n        const attachments = await Zotero.Items.get(topItem.getAttachments()).filter((i) => i.isPDFAttachment() || i.isSnapshotAttachment() || i.isEPUBAttachment());\n\n        for (let attachment of attachments) {\n            let annotations = await getAnnotationsBySection(attachment);\n            for (let section in annotations) {\n                if (!annotationsCollection[section]) {\n                    annotationsCollection[section] = [];\n                }\n                annotationsCollection[section] = annotationsCollection[section].concat(annotations[section]);\n            }\n        }\n\n        // Generate publication details\n        let otherName = topItem.getField(\"proceedingsTitle\") + topItem.getField(\"university\")\n            + topItem.getField(\"publisher\") + topItem.getField(\"repository\")\n            + topItem.getField(\"institution\") + topItem.getField(\"meetingName\");\n\n        let publicationName = topItem.getField(\"publicationTitle\") + otherName;\n        let sourceName = topItem.getField(\"journalAbbreviation\") + otherName;\n\n        // HTML Output\n        let res = `\n        <h1>${topItem.getField('title')}</h1>\n        <hr/>\n        <p><b>Author:</b> ${authorDisplay[1]}</p>\n        <p><b>Date:</b> ${topItem.getField('date')}</p>\n        <p><b>Source:</b> ${publicationName}</p>\n        <p>${(() => {\n                const doi = topItem.getField(\"DOI\");\n                return doi\n                    ? `<b>DOI:</b> <a href=\"https://doi.org/${doi}\">${doi}</a>`\n                    : `<b>URL:</b> <a href=\"${topItem.getField('url')}\">${topItem.getField('url')}</a>`;\n            })()}</p>\n        <p><b>Full Text:</b> ${(() => {\n                const pdfAttachment = attachments.find((i) => i.isPDFAttachment());\n                return pdfAttachment\n                    ? `<a href=\"zotero://open-pdf/0_${pdfAttachment.key}\">${pdfAttachment.getFilename()}</a>`\n                    : '';\n            })()}</p>\n        <p><b>Abstract:</b> <i>${topItem.getField('abstractNote')}</i></p>\n        <hr/>\n        ${(() => {\n                let output = \"\";\n                for (let section in annotationsCollection) {\n                    if (annotationsCollection[section].length > 0) {\n                        output += `<h2>${section}</h2>`;\n                        output += annotationsCollection[section].join('');\n                    }\n                }\n                return output;\n            })()}\n    `;\n        return res;\n    })()\n}"
