name: Build and publish Docker images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - tag_suffix: ""
            with_tesseract: "false"
            with_fts: "false"

        #   - tag_suffix: "-full"
        #     with_tesseract: "true"
        #     with_fts: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          build-args: |
            WITH_TESSERACT=${{ matrix.with_tesseract }}
            WITH_FTS=${{ matrix.with_fts }}

          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}${{ matrix.tag_suffix }}
            ${{ github.event.release.prerelease == false && format('ghcr.io/{0}:latest{1}', env.IMAGE_NAME, matrix.tag_suffix) || '' }}