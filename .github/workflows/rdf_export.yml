name: Export Store to RDF

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  export_rdf:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🔄 Pull remote changes before modifying files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Run export_rdf()
        run: |
          python local/local_z2rdf.py export_rdf --force

      - name: 📤 Commit and push RDF export
        run: |
          git add local/exports/
          git diff --cached --quiet || git commit -m "🔄 Export RDF files via GitHub Action"
          git push