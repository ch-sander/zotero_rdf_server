<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ontology browser · Zotero RDF Server Workbench</title>
  <link rel="stylesheet" href="../assets/workbench/workspace.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../assets/workbench/workspace.js" defer></script>

  <script src="classes.js" defer></script>
  <script src="../partials/load-partials.js" defer></script>
</head>
<body class="wk-page">
  <a class="wk-skip" href="#workspace-main">Skip to content</a>
  <div id="custom-header-container"></div>
  <nav class="wk-nav" aria-label="Workbench">
    <div class="wk-nav-inner">
      <a class="wk-brand" data-workspace-home href="../"><span class="wk-mark" aria-hidden="true"></span>Workbench</a>
      <div class="wk-tabs">
        <a href="../search/">Full-text search</a>
        <a href="../analyze/">Analysis</a>
        <a href="../filter/" data-rdf-tool="filter">Search form</a>
        <a href="../query/" data-rdf-tool="query">Query builder</a>
        <a href="../browse/" aria-current="page" data-rdf-tool="browse">RDF browser</a>
        <a href="../edit/" data-rdf-tool="edit">Editor</a>
      </div>
      <button type="button" class="wk-button wk-inspect" data-show-queries aria-label="Show queries" aria-haspopup="dialog">Show queries</button>
    </div>
  </nav>
  <main class="wk-main rdf-view" id="workspace-main" tabindex="-1">
    <header class="wk-heading">
      <div><h1>Ontology browser</h1><p>Browse RDF classes and open the resources that belong to them.</p></div>
    </header>
    <section class="resource-head wk-panel">
      <h2 id="class-label" class="resource-label"></h2>
      <p id="class-uri"></p>
      <p><a href="/ontology/ttl" target="_blank" rel="noopener">Ontology (Turtle)</a> · <a href="../ontology" target="_blank" rel="noopener">Ontology viewer</a></p>
          <div id="view-options"></div>
    </section>

    <section id="comment-box" class="comment-box" hidden>
      <div id="comment-text"></div>
    </section>

    <section role="status" id="status" class="status">Loading classes …</section>

    <section id="content" hidden>
      <div class="layout">
        <nav class="class-nav" aria-label="Class hierarchy">
          <details open data-small-disclosure>
            <summary>Classes</summary>
            <ul id="class-tree"></ul>
          </details>
        </nav>

        <section class="class-content">
          
        <details open>
          <summary>Instances</summary>

          <div class="table-toolbar">
            <input
              id="instance-search" aria-label="Search instances"
              type="search"
              placeholder="Search instances..."
            >

            <span id="instance-count"></span>

            <div class="pagination">
              <button id="prev-page" type="button">Previous</button>
              <span id="page-info"></span>
              <button id="next-page" type="button">Next</button>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Instance</th>
                <th>URI</th>
              </tr>
            </thead>
            <tbody id="instances"></tbody>
          </table>
        </details>
        </section>
      </div>
    </section>

  </main>
  <div id="custom-footer-container"></div>
</body>
</html>
