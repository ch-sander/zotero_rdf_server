<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>RDF Resource Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <div id="custom-header-container"></div>

    <header>        
        <h2 id="resource-label" class="resource-label"></h2>
        <div id="resource-types" class="resource-types"></div>
        <p id="resource-uri"></p>
        <a id="edit-resource-link" href="#" class="edit-button" target="_blank" rel="noopener noreferrer" hidden>
          Edit resource
        </a>
    </header>
    <section id="comment-box" class="comment-box" hidden>
    <div id="comment-text"></div>
    </section>

    <section id="sameas-box" class="linkbox" hidden>
    <h4>Same As:</h4>
    <ul id="sameas-list"></ul>
    </section>
    <section id="related-box" class="linkbox" hidden>
      <h4>Related:</h4>
      <ul id="related-list"></ul>
    </section>
    <section id="status" class="status">
      Loading Ressource …
    </section>

    <section id="content" hidden>
      <details open>
        <summary>Properties</summary>

        <table>
          <thead>
            <tr>
              <th>Property</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="triples"></tbody>
        </table>
      </details>
    </section>

    <section id="incoming-section" hidden>
      <details>
        <summary>References to Resource</summary>

        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Property</th>
            </tr>
          </thead>
          <tbody id="incoming-triples"></tbody>
        </table>
      </details>
    </section>

    <footer id="generated-at" hidden></footer>
  </main>

  <div id="custom-footer-container"></div>

  <script src="viewer.js"></script>
  <script src="../../partials/load-partials.js" defer></script>
</body>
</html>
