<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full-text search · Zotero RDF Server Workbench</title>
  <link rel="stylesheet" href="algolia-min.css">
  <link rel="stylesheet" href="../assets/workbench/workspace.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../assets/workbench/workspace.js" defer></script>

  <script src="instantsearch-client.js" defer></script>
  <script src="instantsearch.js" defer></script>
  <script src="searchkit.js" defer></script>
  <script src="app.js" defer></script>
  <script src="../partials/load-partials.js" defer></script>
</head>
<body class="wk-page">
  <a class="wk-skip" href="#workspace-main">Skip to content</a>
  <div id="custom-header-container"></div>
  <nav class="wk-nav" aria-label="Workbench">
    <div class="wk-nav-inner">
      <a class="wk-brand" data-workspace-home href="../"><span class="wk-mark" aria-hidden="true"></span>Workbench</a>
      <div class="wk-tabs">
        <a href="../search/" aria-current="page">Full-text search</a>
        <a href="../analyze/">Analysis</a>
        <a href="../filter/" data-rdf-tool="filter">Search form</a>
        <a href="../query/" data-rdf-tool="query">Query builder</a>
        <a href="../browse/" data-rdf-tool="browse">RDF browser</a>
        <a href="../edit/" data-rdf-tool="edit">Editor</a>
      </div>
      <button type="button" class="wk-button wk-inspect" data-show-queries aria-label="Show queries" aria-haspopup="dialog">Show queries</button>
    </div>
  </nav>
  <main class="wk-main ocr" id="workspace-main" tabindex="-1">
    <header class="wk-heading">
      <div><h1>Full-text search</h1><p>Search OCR passages by keyword, phrase, or similarity.</p></div>
    </header>
    <section class="wk-panel search-panel" aria-label="Search the corpus">
      <label class="wk-field index-field">Search index
        <select id="index-select">
          <option value="scigma-main-corpus">Main Corpus Index</option>
          <option value="scigma-complete">Complete Index</option>
          <option value="scigma-main-corpus-llm">LLM Index</option>
          <option value="scigma-main-corpus-pending">Recent Index</option>
          <option value="scigma-main-lit">Secondary Literature Index</option>
          <option value="scigma-main-notes">Scholarly Notes Index</option>
        </select>
      </label>
      <div id="searchbox" aria-label="Search terms"></div>
    </section>
    <div class="search-layout">
      <aside class="wk-panel facets" aria-label="Search filters">
        <details open data-small-disclosure><summary>Filters</summary>
          <div id="dynamic-facets"></div><div id="clear"></div>
        </details>
      </aside>
      <section class="search-results" aria-labelledby="results-heading">
        <div class="results-head"><div><h2 id="results-heading">Results</h2>
          <div id="stats" role="status"></div></div>
          <a id="analyze-terms" href="../analyze/" hidden>Analyze these terms&nbsp;↗</a>
        </div>
        <div id="hits"></div><div id="pagination"></div>
      </section>
    </div>
  </main>
  <div id="custom-footer-container"></div>
</body>
</html>
