<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guided search form · Zotero RDF Server Workbench</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/@triply/yasgui/build/yasgui.min.css">
  <link rel="stylesheet" href="fa/css/all.min.css">
  <link rel="stylesheet" href="sparnatural-form.css">
  <link rel="stylesheet" href="../assets/workbench/workspace.css">
  <link rel="stylesheet" href="../query/builder-layout.css">
  <script src="../assets/workbench/workspace.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous" defer></script>
  <script src="../query/sparql-workspace.js" defer></script>
  <script src="https://unpkg.com/@triply/yasgui/build/yasgui.min.js" defer></script>
  <script src="sparnatural-form.js" defer></script>
  <script src="sparnatural-yasgui-plugins.js" defer></script>
  <script src="main.js" defer></script>
  <script src="../partials/load-partials.js" defer></script>
</head>
<body class="wk-page">
  <a class="wk-skip" href="#workspace-main">Skip to content</a>
  <div id="custom-header-container"></div>
  <nav class="wk-nav" aria-label="Workbench">
    <div class="wk-nav-inner">
      <a class="wk-brand" data-workspace-home href="../"><span class="wk-mark" aria-hidden="true"></span>Workbench</a>
      <div class="wk-tabs">
        <a href="../search/">Full-text search</a>
        <a href="../analyze/">Analysis</a>
        <a href="../filter/" aria-current="page" data-rdf-tool="filter">Search form</a>
        <a href="../query/" data-rdf-tool="query">Query builder</a>
        <a href="../browse/" data-rdf-tool="browse">RDF browser</a>
        <a href="../edit/" data-rdf-tool="edit">Editor</a>
      </div>
      <button type="button" class="wk-button wk-inspect" data-show-queries aria-label="Show queries" aria-haspopup="dialog">Show queries</button>
    </div>
  </nav>
  <main class="wk-main sparql-tool" id="workspace-main" tabindex="-1">
    <header class="wk-heading">
      <div><h1>Guided search form</h1><p>Find Zotero records with a predefined Sparnatural form and export matching data.</p></div>
    </header>
    <section class="wk-panel builder-panel" aria-label="Guided search form">
      <div class="service-strip"><span>Endpoint <a id="displayEndpoint" href="/sparql/query">/sparql/query</a></span>
        <a href="/ontology/ttl" target="_blank" rel="noopener">Ontology (Turtle)</a></div>
      <sparnatural-form
          id="sparnatural-form"
          src="../query/config-dev.ttl /ontology/ttl"
          endpoint="/sparql/query"
          lang="en"
          defaultLang="en"
          limit="5000"
          debug="true"
          form="form-configs/scigma/form.json"
          query="form-configs/scigma/query.json"
          prefixes="zot:http://www.zotero.org/namespaces/export# semz:https://semantic-html.org/vocab# owl:http://www.w3.org/2002/07/owl# skos:http://www.w3.org/2004/02/skos/core# geo:http://www.opengis.net/ont/geosparql# scigma:https://data.scigma.de/resources/ cito:http://purl.org/spar/cito/ schema:https://schema.org/ dct:http://purl.org/dc/terms/ wd:http://www.wikidata.org/prop/direct/"
        ></sparnatural-form>
      <div class="builder-actions">
        <button class="wk-button" type="button" id="sparql-toggle" aria-controls="yasqe" aria-expanded="false">Show SPARQL editor</button>
      </div>
      <div id="yasqe" hidden></div>
    </section>
    <section class="wk-panel builder-results" aria-labelledby="results-title">
      <h2 class="wk-section-title" id="results-title">Query results</h2>
      <div id="yasr"></div>
    </section>
  </main>
  <div id="custom-footer-container"></div>
</body>
</html>
