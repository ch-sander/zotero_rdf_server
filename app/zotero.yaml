inject_env: true # replacing ${VAR} in this YAML from .env. Use for secrets
context:
  vocab: "http://www.zotero.org/namespaces/export#"
  api_url: "https://api.zotero.org/"
  base: "https://www.zotero.org/"
  schema: "https://api.zotero.org/schema" # if given, will create a basic OWL ontology as named graph with IRI of vocab
  user: "zotero_rdf_server/0.1 (+raramagnetica@gmail.com)" # set User-Agent to identify in Zotero API requests in header. Can also be set per library.
  limit: 100 # chunk size per API request  

defaults:  
  mode: "override" # "merge" or "default". Defines how defaults are enforced for library setups specified below
  max_data: 0 # max items (0 or null = no limit) for paginated API "json" load (ignored in manual import or import from rdf)
  load_mode: "json"  # "json" or "rdf" or "manual_import".
                     # json: Will use Zotero's API (paginated) to get a full JSON of items and collections. You may set a file path in "save_to" to store a json dump locally that can be used further on as source for manual_import ("$" will be replaced by library_id for a path pattern).
                     # rdf: will use Zotero's API (paginated) to get full RDF of items. Parsing is done with Zotero's own translators, set in "rdf_export_format". You may set a directory path in "save_to" to store a json dump locally that can be used further on as source for manual_import.
                     # manual_import: it will look for all files in the import folder in a directory of the library's "name" or set in "load_from" ("$" will be replaced by library_id for a path pattern).
  rdf_export_format: "rdf_zotero" # "rdf_zotero" or "rdf_bibliontology" only needed if load_mode = "rdf"
  # base_uri: "https://www.example.com#" used as the uri for the library named graph and as the base uri for all named nodes created for zotero items and collections. By default is "{context.base}{libraries.library_type}/{libraries.library_id}" as specified in this yaml
  knowledge_base_graph: "https://www.zotero.org/entities" # Will be used to create identical uuids for named nodes accross multiple libraries in the union graph. If not given, uses base_uri. A knowledge base to be loaded into the store can be set as library below, with library_type: "knowledge base".
  mapping_base_graph: "https://www.zotero.org/mappings"  # Will be used to map between Zotero input data and the knowledge base. A mapping graph to be loaded into the store can be set as library below, with library_type: "mapping".
  
  plugin: # config related to plugins, not checked for consistency, and read by plugin individually, but per library
    taxonomy: # requires sync config for library (adding Zotero notes to remote libary)
      note_key : null # create if none
      mapping: "/app/plugins/taxonomy/mapping.json"
    notes_parser: # loads the semantic-html package to parse notes HTML to JSON-LD and load into Store
      knowledge_base_mapping: true # Will map found entities in notes parsing to the library's knowledge base (knowledge_base_graph)
      fuzzy: 90 # the minimum fuzzy score (threshold in %) to match strings as identical entities (places, persons). Defaults to 90 if missing. Can be set in mapping.json, too.
      base_uri: "https://semantic-html.org" # graph for the parser result RDF to be stored in. Uses the library's base_uri as default
      auto: true # hook parser into loading process if true
      mapping: "/app/plugins/parser/mapping.json" # load file or build dict here
      metadata: "/app/plugins/parser/meta.json" # load file or build dict here
    fts: # Full Text Search Plugin. Loads text from URL, performs OCR, ingests to Open Search index (see docker compose configuration). Lists of dictionnaries are possible, too.
      logging: # not deployed, yet
        ingest_into_graph: "" # whether the logging store shall be stored in the main store in a named graph by this IRI
      query: "/app/plugins/fts/fts.sparql" # SPARQL query to retrieve URLs for OCR/ingesting
      ocr: true
      vector:
        framework: null # "SentenceTransformer" or null or "FastText"
        config_path: "/app/plugins/fts/config.yml"
      open-search:
        targets: ["zotero-ocr"] # indices to target        
        config_path: "/app/plugins/fts/config.yml" # fallback FTS_CONFIG in ENV
      kraken:          
        model_kwargs:
          domain: print
          model_name:
          segmenter:
          binarize:
          config_path: "/app/plugins/fts/config.yml"
          # save_images: "/app/plugins/fts/data" # creates folder per processed file
          # save_text: "/app/plugins/fts/data" # creates folder per processed file
          # seg_blur_radius: 1.0
        ocr_kwargs:
          file_formats: ["pdf", "iiif"]
          iiif_max_width: 2000
          iiif_format: "jpg"
          pdf_dpi: 200
          pdf_text_policy:
            enabled: true
            min_chars: 80
            min_alpha_ratio: 0.6
          timeout: 30
        file_kwargs:
          img_out: "kraken/images"
          txt_out: "kraken/texts"
          img_ext: "jpg"
          txt_ext: "txt"
          skip_existing_text: "active"
          skip_existing_image: "active"
          on_error: "log"
  map: # skip this dict if no specs needed. Will ignore empty lists as constraints
    # white: [title,date] # a white list (will only include these and those in rdf_mapping)
    # black: [title,date] # a black list (will ingore these)
    # rdf_mapping: [creators,tags,collections,parentItem,parentCollection] # if not specified, uses reasonable defaults for entities and datatypes
    item_type: ["item","_itemType"] # takes values from field for rdf:type. Start with _ to set the value of the respecitve key (i.e. metadata field name) in the Zotero data, otherwise sets constant type predicate. If not indicated, uses "item". If not starting with "http" will use defaul vocab from context.
    collection_type: ["collection"] # If not indicated, uses "collection"
    fuzzy: 90 # the minimum fuzzy score (threshold in %) to match strings as identical entities (places, persons). Defaults to 90 if missing
    named_library: "inLibrary" # if specified will add an object property by that name with a named node for the library's named graph URI to facilitate queries accross multiple named graphs
    rdf_mapping: # creates entities for defined fields (Literals otherwise)
      publisher:
        fuzzy: 90 # uses default set above if missing
        types: ["publisher"] # uses field name if missing
        # value: "" # setting this will overwrite Zotero input data (dict or str)
      series:
        fuzzy: 80
        re_split: "\\s*;\\s*" # split string in field on ;.
      place:
        fuzzy: 80
        re_split: "\\s*;\\s*"
      creators:
        # resource: # Node or Literal
        fuzzy: 90
        types: ["actor"] # adds defined Zotero namespace if not a complete IRI        
        role_types: ["creatorRole"] # RDF type of role node
        role_properties: ["hasCreator"] # property from role node to actor
        properties: ["creators"] # property from item to role node
      tags:
        fuzzy: 100
        types: ["tag","http://www.w3.org/2004/02/skos/core#Concept"]
        tag_properties: ["tag", "http://purl.org/dc/terms/subject", "http://www.w3.org/2004/02/skos/core#prefLabel"]
        relations:
        relation_properties: ["relations", "http://purl.org/dc/elements/1.1/relation"]
        same_properties: ["http://www.w3.org/2002/07/owl#sameAs"]
      url:
        datatyping: url # datatyping runs a smart converter and types accordingly
        properties: ["url", "http://www.w3.org/2002/07/owl#sameAs"]
      doi:
        datatyping: doi
        properties: ["doi", "http://www.w3.org/2002/07/owl#sameAs"]
      numPages:
        datatyping: int
      date:
        datatyping: date
      dateModified:
        datatyping: datetime
      title: # language tagged from language map
        datatyping: title
        # properties: ["title", "http://www.w3.org/2000/01/rdf-schema#label"]
      language: # language tag from language map
        datatyping: language
      extra:
        datatype: xsd:string # no converter, just typed
        re_split: "\\s*;\\s*"
      "href":
        datatyping: url
    additional:
      - property: "http://www.w3.org/2000/01/rdf-schema#label"
        value: "_name" # Start with _ to set the value of the respecitve key (i.e. metadata field name) in the Zotero data, otherwise sets constant value as object. If not starting with "http" will use defaul vocab from context.
        named_node: false
        add_to: ["item", "collection", "library"] # consider only for libraries, items, and/or collections. If argument missing, will not restrict
        # prefix: "https://doi.org/" # add this before the actual value
      - property: "http://www.w3.org/2000/01/rdf-schema#comment"
        value: "This resource was created by Zotero RDF Server (https://github.com/ch-sander/zotero_rdf_server)"
        named_node: false
      - load: # uses pyoxigraph.load() signature to dynamically load any RDF content. https://pyoxigraph.readthedocs.io/en/stable/store.html#pyoxigraph.Store.load {{node}} replaces item IRI and "_"-prefixed text will be replaced by respective Zotero key in Zotero item data
          - add_to: ["item","collection"]
            format: TURTLE
            # base_iri: "_baseUri"
            # to_graph: "https://www.zotero.org/export" # Library graph per default
            lenient: true
            input: |
              @prefix purl: <http://purl.org/dc/terms/> .
              <{{node}}> purl:identifier "_key" .
          - add_to: ["collection"]
            format: TURTLE
            lenient: true
            input: |
              @prefix schema: <https://schema.org/> .
              <{{node}}> schema:name "_name" .
  # api_query_params: # these parameters are directly transformed to GET parameters as outlined for Zotero API (v3)
    # itemType: "book"  # optional, freely configurable
    # tag: "important"  # optional, freely configurable
    # collection: "XYZ123"  # optional, currently not supported by Zotero API (v3). The internal parser supports
                            # limiting search to one collection.

libraries:
  - name: Knowledge_Base # stores known named entities (once created automatically from mapping, exported via API, manually refined etc.)
    library_type: "knowledge base" # "knowledge base" does not require library_id and library_type
    base_uri: "https://www.zotero.org/entities"
    description: "Named Entities"
    load_mode: "manual_import"
    load_from: "/app/import/kb" # folder containing RDF file(s)
    # sync: # For Plugin: Define a secondary Zotero library to sync RDF from primary library to, each resource as one note (needs rw access for access token). Also used for writing RDF Zotero notes back into store (ro access sufficient). You may also use the primary library as the second one, but make sure to indicate a dedicated collection (or none so that one will be created)
    #   api_key: "${SECRET_KEY}"
    #   library_type: "group"
    #   library_id: "000"
    #   collection_id: "000"


  - name: MAP # stores mapping for entity matching between library and knowledge base
    library_type: "mapping"
    base_uri: "https://www.zotero.org/mappings"    
    plugin:
      notes_parser:
        auto: false

