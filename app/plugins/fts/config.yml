            There may be input that doesn't contain any text. Return an empty list in this case: []

            Only respond with valid JSON List(Dict), no verbal explanation! Otherwise my parser breaks.

rag:
  working_dir: ./data/lightrag
  workspace: default

  storages:
    kv: OpenSearchKVStorage
    vector: OpenSearchVectorDBStorage
    graph: OpenSearchGraphStorage
    doc_status: OpenSearchDocStatusStorage

  opensearch:
    hosts: opensearch:9200
    # user: admin # adjust
    # password: changeme
    use_ssl: false
    verify_certs: false

    # optional:
    timeout: 30
    max_retries: 3
    number_of_shards: 1
    number_of_replicas: 0
    knn_ef_construction: 200
    knn_m: 16
    knn_ef_search: 100
    use_ppl_graphlookup: true

  llm:
    binding: ollama
    host: http://host.docker.internal:11434
    model: qwen2.5:7b
    options:
      num_ctx: 8192 # 32768

  embedding:
    binding: ollama
    host: http://host.docker.internal:11434
    model: nomic-embed-text
    dim: 768
    max_token_size: 8192

  query:
    mode: mix
    response_type: Multiple Paragraphs
    top_k: 40
    enable_rerank: true
    only_need_context: false
    only_need_prompt: false

viewer:
  image_root: "/app/exports/kraken/images"
  text_root: "/app/exports/kraken/texts"
  image_ext: jpg
  text_ext: txt
  # dashboard_url: http://localhost:5601/app/discover#/doc/fe2dc870-1182-11f1-86a9-eb629f790cf7/ocr-scigma?id=
  # viewer_urls
  #   view: /plugin/fts/view
  #   ... defined best in app
  # static_url: "/ui/view" # set by app to be dynamic
  OpenSeadragon:
    src: "https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"
    prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/images/"
    showNavigator: false
    maxZoomPixelRatio: 2
    visibilityRatio: 1
    constrainDuringPan: true
  ocr_frameworks:
    - value: kraken
      label: Kraken
    - value: tesseract
      label: Tesseract
    - value: transformer
      label: Transformer

kraken:
  models_dir: "/app/plugins/fts/models"

  active:
    domain: "print"        # print | handwriting | medieval | ...
    model: null            # optional: hard override; if null -> domain default
    segmentation: "BLLA"   # "BLLA" or name from models (e.g., "MySegModel")

  default_models:
    print: "LatinIncunabulaEarlyPrints" # "CATMuS-Print-Large"
    handwriting: "McCATMuS"
    medieval: "CATMuS-Medieval"

  default_domain: "print"

  models: # Note that download may fail, set path to local model file if possible
    # --- CATMuS Print (Tiny/Small/Large) ---
    CATMuS-Print-Tiny:
      file: "catmus-print-fondue-tiny-2024-01-31.mlmodel"
      url: "https://zenodo.org/records/10602357/files/catmus-print-fondue-tiny-2024-01-31.mlmodel?download=1"
      checksum_algo: "md5"
      checksum: "bd0553da6c68d5251d5e89b08cef0f76"

    CATMuS-Print-Small:
      file: "catmus-print-fondue-small-2024-01-31.mlmodel"
      url: "https://zenodo.org/records/10602307/files/catmus-print-fondue-small-2024-01-31.mlmodel?download=1"
      checksum_algo: "md5"
      checksum: "d4b8a617cf57eeed1f7edb9ffb023271"

    CATMuS-Print-Large:
      file: "catmus-print-fondue-large.mlmodel"
      url: "https://zenodo.org/records/10592716/files/catmus-print-fondue-large.mlmodel?download=1"
      checksum_algo: "md5"
      checksum: "9ed1ed4a6c34e1f4b292b380bf9c5543"

    # --- CATMuS Medieval ---
    CATMuS-Medieval:
      file: "catmus-medieval.mlmodel"
      url: "https://zenodo.org/records/12743230/files/catmus-medieval.mlmodel?download=1"
      checksum_algo: "md5"
      checksum: "02bb2e4e5bc681c11579a860c40dc5a4"

