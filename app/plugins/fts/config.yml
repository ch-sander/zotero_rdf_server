                "concept": "intellectualis natura",
                "normalized": "intelligentia naturalis",
                "translation": "natural intelligence"
              },
              {
                "concept": "bonum morale infinitum",
                "normalized": "infinitum bonum morale",
                "translation": "infinite moral good"
              },
              {
                "concept": "ratio iniuriæ",
                "normalized": "ratio injuriae",
                "translation": "ratio of injury"
