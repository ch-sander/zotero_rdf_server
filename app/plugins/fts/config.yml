llm:
  client:
    host: "http://host.docker.internal:11434" # or ollama:11434 if in Docker Network
  chat:
    model: "qwen2.5:7b" #  "llama3.2:3b", "nomic-embed-text:latest"
    messages:
      - role: system
        content: |
            You are provided Latin text of a page rendered with poor OCR, mostly theological texts of the early modern period. Extract the most relevant concepts as normalized Latin phrases or terms and translate them. Output a list of JSON no more than 20 dictionaries with the following structure:

            {
              "concept": {
                "text": "<Latin phrase or word>",
                "normalized": "<Normalized Latin form>",
                "translation": "<English translation>"
              },
              ...
            }

            # Input:

            The sample Latin text is as follows:

            Difputat . I.
            11
            Artic . II .
            34
            35
            36
            tùm , non folùm priuare bono morali ipfi homini debito , fed bono morali debito toti intelleetuali naturæ , in qua Deus includitur , & cuius
            bonum morale infinitum eft . Cæterum ifta confideratio non videtur fufficiens ad infinitatem propriè , & determinarè , fed folùm analogicè , & in
            confufo , quia intellectualis natura , vt comprehendit Deum , & creaturas intellectuales , non eft
            pofitiue infinita , fed abftractiuè ; abftrahit enim
            analogicè a finito , & infinito . Ex hoc ergo quod
            peccatum fit contra naturam intellectualem , vt
            fic . folùm fequitur , quod fit contra bonum intellectuale infinitum , analogicè , & indeterminatè
            & in communi , quod eft effe infinitum fecundùm
            quid , non autem opponitur bono morali determinatè , vt infinito , & provt eft bonum Dei , fed
            bonum morale hominis .
            Confiderando ergo peccatum ex parte iniuriæ .
            Qui defendunt effe folùm infinitum fecundùm
            quid , nituntur in duobus . Primò , quia ratio iniuriæ eft folùm extrinfeca quædam denominatio in
            peccato , & confequenter reputatur , tanquam infinitas fecundùm quid ; quando enim prædicatum
            aliquod poteft conuenire intrinfecè , & extrinfecè , ficut eft ly infinitum , ei cui conuenit extrinfecè ,
            fecundum quid dicitur conuenire abfolutè loquendo . Sed hoc non multum probat , quia fatentur oppofiti Authores , quod ifta infinitas cóparata ad infinitatem in toto genere entis , vel in
            ratione infinitatis extrinfeca , poteft dici iecundùm quid , id eft , minor illà . Quæftio tamen præfens procedit de infinitate peccati in eo genere
            in quo eft infinitas , fcilicet in genere iniuriæ , an
            in illo genere fit fecundùm quid , vel fimpliciter ? geEt ideò fecundùm fundamentum additur , quod
            Pater Suarez profequitur , fcilicet , quia infinitas
            hæc in genere iniurie poteft crefcere in peccato , & eft maior in vno , quàm in alio ; ergo fignum
            eft infinitatem non effe fimpliciter adhuc in
            nere iniuriæ , fiquidem in hoc genere poteft creadere , & minui . Atque ita licet offendat Deum ,
            qui eft fimpliciter infinitus , tanquam obiectum
            offenfionis tamen inde folùm habet obie& tum finitè cognofcit fimpliciter loquendo , ita
            & finitè odit , vel amat , & ad illud conuertitur , vel
            auertitur ; ergo fimpliciter dicendum eft peccatuin finitum , & fecúdùm quid infinitum ; eo quod
            vt attingatur obiectum infinitum , non requiritur
            infinitas fimpliciter in actu , fed fufficit quod fit
            altioris ordinis , quam infiniti actus attingentes
            obiecta inferiora finita . Sicut vifio beata eft altioris ordinis attingendo Deum in fe , & non habet infinitatem fimpliciter ,
            ficque excedit infinitas cognitiones inferiores
            circa obiecta finita . Et de hoc amplius dicetur in
            folutione argumentorum .
            Tertia vero pars conclufionis pofitæ , quæ communiter tenetur à Thomiftis , & à Patre Suarez citato probatur . Quia valor charitatis , & gratiæ ,
            fumitur ab ipfa forma charitatis , & fecundùm
            formalem effectus , quem fubiecto præbet , fic eft
            eius valor ; formalis autem eff ctus , quem præbet
            fubiecto , opponitur peccato , quatenùs eft priuatio rectitudinis debite fubiecto . Illud autem ,
            quod ex peccato confequitur , fcilicet læfionem
            juris diuini , & moralitatem ofenfe , charitas , &
            gratiâ non attingit fecundùm valorem quem
            præbet fubiecto , & actni • b eo procedenti , fed fecundùm quod procedit à remiffione diuina , cuius
            effectus eft gratia . Quo fenfu Caietanus dixit in
            •
            pro
            præfenti gratiam , & charitatem fatisfacere
            peccato ex acceptione diuinæ mifericordiæ , à qua
            procedit .""

            ## Output:            
            [
              {
                "concept": "Deus",
                "normalized": "Deum",
                "translation": "God"
              },
              {
                "concept": "bono morali",
                "normalized": "bonti moralis",
                "translation": "moral good"
              },
              {
