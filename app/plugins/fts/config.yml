logging: # not implemented yet
  active: true
  store: ./logs
  templates:
    kraken:
      trig: ""
    open-search:
      trig: ""

vector:
  embed:
    SentenceTransformer:
      model: "intfloat/multilingual-e5-large"
    FastText:
      model: "model.bin"
  train:
    FastText:
      model: "model.bin"
      source_dir:
      source_file_ext: "txt"
      train_kwargs:

llm:
  client:
    host: http://ollama:11434 # "http://host.docker.internal:11434" # or ollama:11434 if in Docker Network

  langextract:
    concepts:
      enabled: true
      model: "qwen2.5:7b-instruct"
      model_url: "http://ollama:11434" # or use client above?
      temperature: 0.0
      max_char_buffer: 1200
      extraction_passes: 1
      max_workers: 1
      timeout: 300

      prompt_description: |
        Extract relevant Latin concepts from noisy OCR text of early modern theological works.

        Rules:
        - Extract only concepts that appear verbatim in the source text.
        - Each extraction_text must be an exact substring of the source text.
        - Extract concepts of 1 to 3 words.
        - Prefer theological, philosophical, moral, metaphysical, legal, and scholastic terms.
        - Do not extract full sentences.
        - Do not invent anything.
        - If uncertain, omit.
        - Add attributes:
          - normalized: corrected standard Latin form
          - translation: concise English translation

      examples:
        - text: "anima rationalis appetit bonum divinum."
          extractions:
            - extraction_class: "concept"
              extraction_text: "anima rationalis"
              attributes:
                normalized: "anima rationalis"
                translation: "rational soul"
            - extraction_class: "concept"
              extraction_text: "bonum divinum"
              attributes:
                normalized: "bonum divinum"
                translation: "divine good"

  chats:
    concepts:
      model: "llama3.2:3b" #  "llama3.2:3b", "qwen2.5:7b", "nomic-embed-text:latest"
      temperature: 0.2
      top_p: 0.9
      max_tokens: 500
      messages:
        - role: system
          content: |
                You are given noisy OCR text from early modern Latin theological works.

                Extract the most relevant concepts and translate them into English. Relevance is undertood as semantic description of the Latin text.

                Return ONLY a valid JSON array of objects.
                Each object must contain exactly these keys:
                "concept", "normalized", "translation"

                Rules:
                - "concept" must be an exact substring from the source text.
                - Do not correct OCR errors in "concept".
                - "normalized" should correct OCR errors and provide a standard Latin form.
                - "translation" should be concise.
                - Extract only concepts of 1 to 3 words.
                - Do not extract full sentences.
                - Do not extract sentence fragments longer than 3 words.
                - Prefer meaningful theological, philosophical, and moral terms.
                - Ignore numbers, section labels, punctuation noise, and meaningless OCR fragments.
                - Return at most 20 items.
                - If nothing meaningful is found, return [].

                Critical output rules:
                - Output JSON only.
                - Do not output markdown.
                - Do not output prose.
                - Do not output explanations.
                - Do not output notes.
                - Do not output comments.
                - Do not output any text before the JSON array.
                - Do not output any text after the JSON array.
                - The first character of the response must be [
                - The last character of the response must be ]

                Invalid concepts (ONLY EXAMPLES):
                - "peccatuin fit contra naturam intellectualem"
                - "quia ratio iniuriæ eft folùm extrinfeca"
                - "quod fit contra bonum intellectuale infinitum"

                Valid concepts (ONLY EXAMPLES):
                - "peccatuin"
                - "naturam intellectualem"
                - "ratio iniuriæ"
                - "in peccato"
                - "infinitum fecundùm quid"

                Here are examples (but do not simply return the example but create a return given the specific input. Rather do not return any objects before simply returning the exmaple below, not matching the input text.)

                Example input:
                peccatuin fit contra naturam intellectualem , vt fic . folùm fequitur ,
                quod fit contra bonum intellectuale infinitum , analogicè . Qui defendunt
                effe folùm infinitum fecundùm quid , nituntur in duobus . Primò , quia
                ratio iniuriæ eft folùm extrinfeca quædam denominatio in peccato .

                Example output:
                [
                  {
                    "concept": "peccatuin",
                    "normalized": "peccatum",
                    "translation": "sin"
                  },
                  {
                    "concept": "naturam intellectualem",
                    "normalized": "natura intellectualis",
                    "translation": "intellectual nature"
                  },
                  {
                    "concept": "bonum intellectuale infinitum",
                    "normalized": "bonum intellectuale infinitum",
                    "translation": "infinite intellectual good"
                  },
                  {
                    "concept": "infinitum fecundùm quid",
                    "normalized": "infinitum secundum quid",
                    "translation": "infinite in a certain respect"
                  },
                  {
                    "concept": "ratio iniuriæ",
                    "normalized": "ratio iniuriae",
                    "translation": "nature of injury"
                  },
                  {
                    "concept": "in peccato",
                    "normalized": "in peccato",
                    "translation": "in sin"
                  }
                ]

                Invalid output example:
                [
                  {
                    "concept": "peccatuin",
                    "normalized": "peccatum",
                    "translation": "sin"
                  }
                ]
                Note: The OCR is noisy.

                The invalid example is wrong because it contains text after the JSON array.
    contexts:
      model: "qwen2.5:7b-instruct" #  "llama3.2:3b", "qwen2.5:7b", "nomic-embed-text:latest"
      temperature: 0.2
      top_p: 0.9
      max_tokens: 500
      messages:
        - role: system
          content: |
              Return an array of context terms the Latin text relates to. Focus on seventeenth-century disciplines.

              Limit yourself to clear candidates, do not hallucinate! Never!

              IMPORTANT: Return multiple terms if applicable.
              You pay particular attention to many disciplines being involved, e.g. ["alchemy", "theology"] or ["medicine", "astronomy"]. Most will pertain to theology. I am particularly interested in interdisciplinary texts. In striking cases (ONLY), add the keyword "interdisciplinary"!

              ONLY RETURN A LIST OF STRINGS IN [] THAT CAN BE PARSED BY A MACHINE. DO NOT PROVIDE FURTHER TEXT OR EXPLANATION

rag:
  working_dir: ./data/lightrag
  workspace: default

  storages:
    kv: OpenSearchKVStorage
    vector: OpenSearchVectorDBStorage
    graph: OpenSearchGraphStorage
    doc_status: OpenSearchDocStatusStorage

  opensearch:
    hosts: opensearch:9200
    # user: admin # adjust
    # password: changeme
    use_ssl: false
    verify_certs: false

    # optional:
    timeout: 30
    max_retries: 3
    number_of_shards: 1
    number_of_replicas: 0
    knn_ef_construction: 200
    knn_m: 16
    knn_ef_search: 100
    use_ppl_graphlookup: true

  llm:
    binding: ollama
    host: http://host.docker.internal:11434
    model: qwen2.5:7b
    options:
      num_ctx: 8192 # 32768

  embedding:
    binding: ollama
    host: http://host.docker.internal:11434
    model: nomic-embed-text
    dim: 768
    max_token_size: 8192

  query:
    mode: mix
    response_type: Multiple Paragraphs
    top_k: 40
    enable_rerank: true
    only_need_context: false
    only_need_prompt: false

viewer:
  mode: dynamic
  static_viewer_root: "/app/exports/html"
  image_root: "/app/exports/kraken/images"
  text_root: "/app/exports/kraken/texts"
  image_ext: jpg
  text_ext: txt
  # dashboard_url: http://localhost:5601/app/discover#/doc/fe2dc870-1182-11f1-86a9-eb629f790cf7/scigma-main-corpus?id=
  # viewer_urls
  #   view: /plugin/fts/view
  #   ... defined best in app
  # static_url: "/ui/view" # set by app to be dynamic
  OpenSeadragon:
    src: "https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js" # "/ui/viewer/openseadragon.min.js"
    prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/images/"
    showNavigator: false
    maxZoomPixelRatio: 2
    visibilityRatio: 1
    constrainDuringPan: true
  ocr_frameworks:
    - value: kraken
      label: Kraken
    - value: tesseract
      label: Tesseract
    - value: transformer
      label: Transformer

