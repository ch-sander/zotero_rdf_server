tesseract:
  executable: /usr/bin/tesseract
  tessdata_dir: /opt/tessdata
  data_repo: best         # fast | best | standard
  active:
    lang: lat
    config: "--psm 3"
  defaults:
    print:
      lang: lat
      config: "--psm 3"
    handwriting:
      lang: lat
      config: "--psm 6"

open-search:
  client:
    hosts:
      - host:  opensearch # opensearch, see in docker-compose.yml, sometimes 172.17.0.1
        port: 9200
    retry_on_timeout: true
    timeout: 300
    max_retries: 2
  meta:
    owner: "zotero-rdf-server"
    default_alias: scigma-main-corpus
    max_size: 10000
    environment: "dev"
    # Minimum OpenSearch version this config is designed for
    opensearch_min_version: "2.0.0"

  bulk:
    chunk_size: 100
    max_chunk_bytes: 5242880
    max_retries: 3
    initial_backoff: 1
    max_backoff: 32

  component_templates:
    # Analysis settings for OCR indexing & search
    ct_ocr_pages_v1:
      template:
        settings:
          analysis:
            char_filter:
              ocr_common_map:
                type: mapping
                mappings:
                  - "ſ=>s"
                  - "&=>et"
                  - "ﬁ=>fi"
                  - "ﬂ=>fl"
                  - "ﬀ=>ff"
                  - "ﬃ=>ffi"
                  - "ﬄ=>ffl"
                  - "æ=>ae"
                  - "œ=>oe"
                  - "’=>'"
                  - "‘=>'"
                  - "“=>\""
                  - "”=>\""
                  - "­=>"
                  - "·=> "
              ocr_search_extra_map:
                type: mapping
                mappings:
                  - "æ=>ae"
                  - "œ=>oe"
                  - "v=>u"
                  - "j=>i"
                  - "ae=>e"                  
              ocr_dehyphenate_linebreak:
                type: pattern_replace
                pattern: "(?<=\\p{L})-\\s*\\n\\s*(?=\\p{L})"
                replacement: ""
              ocr_dehyphenate_linebreak_not:
                type: pattern_replace
                pattern: "(?<=\\p{L})¬\\s*\\n\\s*(?=\\p{L})"
                replacement: ""
              ocr_newlines_to_space:
                type: pattern_replace
                pattern: "\\s*\\n\\s*"
                replacement: " "
              ocr_punctuation_soften:
                type: pattern_replace
                pattern: "[,:;.!?()\\[\\]{}]+"
                replacement: " "

            filter:
              latin_stop_minimal:
                type: stop
                stopwords: ["et", "in", "ad", "de", "ut"]
              latin_stop_file:
                type: stop
                stopwords_path: custom/latin_stopwords.txt
                lenient: true
              latin_shingle_3_5:
                type: shingle
                min_shingle_size: 3
                max_shingle_size: 5
                output_unigrams: false
              latin_synonyms:
                type: synonym_graph
                expand: true
                lenient: true
                synonyms:
                  - "vbi, ubi"
                  - "fit, sit"
                  - "iustitia, justitia"
                  - "caelum, coelum"
                  - "philosophia, filosofia"
                  - "dominus, dom."
                  - "liber, book"
              latin_synonyms_file:
                type: synonym_graph
                synonyms_path: custom/latin_synonyms.txt
                expand: true
                lenient: true

            analyzer:
              latin_ocr_index:
                type: custom
                char_filter:
                  - ocr_common_map
                  - ocr_dehyphenate_linebreak
                  - ocr_newlines_to_space
                  - ocr_dehyphenate_linebreak_not
                  - ocr_punctuation_soften
                tokenizer: standard
                filter:
                  - lowercase
                  - asciifolding
                  - latin_stop_minimal
                  - latin_stop_file

              latin_ocr_search:
                type: custom
                char_filter:
                  - ocr_common_map
                  - ocr_dehyphenate_linebreak
                  - ocr_newlines_to_space
                  - ocr_search_extra_map
                  - ocr_punctuation_soften
                tokenizer: standard
                filter:
                  - lowercase
                  - asciifolding
                  - latin_stop_minimal
                  - latin_stop_file
                  - latin_synonyms
                  - latin_synonyms_file

              latin_ocr_shingles:
                type: custom
                char_filter:
                  - ocr_common_map
                  - ocr_dehyphenate_linebreak
                  - ocr_newlines_to_space
                  - ocr_dehyphenate_linebreak_not
                  - ocr_punctuation_soften
                tokenizer: standard
                filter: # No stop words?
                  - lowercase
                  - asciifolding
                  - latin_shingle_3_5

        mappings:
          dynamic: false
          properties:
            source: { type: keyword }
            label: { type: keyword }
            doc_id: { type: keyword }
            page: { type: integer }
            ingest_ts: { type: date }
            text:
              type: text
              term_vector: with_positions_offsets
              analyzer: latin_ocr_index
              search_analyzer: latin_ocr_search
              fields:
                shingles:
                  type: text
                  analyzer: latin_ocr_shingles
                  search_analyzer: latin_ocr_shingles
                  term_vector: with_positions_offsets
            vector:
              type: knn_vector
              dimension: 1024 # adjust
              method:
                name: hnsw
                space_type: cosinesimil
                engine: nmslib
            meta:
              type: object
              dynamic: true
              properties:
                date:
                  type: date
                  format: strict_date_optional_time||yyyy||yyyy-MM
                year:
                  type: short
                  coerce: true
            llm:
              type: object
              dynamic: true   
            contexts: { type: keyword }     
            concepts: # llm
              type: nested
              properties:
                concept:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
                normalized:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
                translation:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
                evidence:
                  type: text
                start:
                  type: integer
                end:
                  type: integer
            concepts_flat:
              type: object
              dynamic: true

          dynamic_templates:
            - meta_as_keyword:
                path_match: "meta.*"
                mapping:
                  type: keyword
                  ignore_above: 256
            - llm_as_keyword:
                path_match: "llm.*"
                mapping:
                  type: keyword
                  ignore_above: 256
            - concepts_flat_as_keyword:
                path_match: "concepts_flat.*"
                mapping:
                  type: keyword
                  ignore_above: 256

  ingest_pipelines:
    ocr_meta_pipeline_v1:
      description: "Split meta.parent_tags by ';' and normalize tag markers"
      processors:
        # "ONLINE; IIIF; handbook" -> ["ONLINE","IIIF","handbook"]
        - split:
            field: "meta.parent_tags"
            separator: "\\s*;\\s*"
            ignore_missing: true

        - split:
            field: "meta.collection_labels"
            separator: "\\s*;\\s*"
            ignore_missing: true

        - split:
            field: "meta.parent_creators"
            separator: "\\s*;\\s*"
            ignore_missing: true
            
        # - script:
        #     lang: painless
        #     source: >
        #       if (ctx.meta != null && ctx.meta.parent_tags instanceof List) {
        #         ctx.meta.parent_tags.removeIf(tag ->
        #           tag == null ||
        #           !(tag instanceof String) ||
        #           tag.length() == 0 ||
        #           !Character.isLetter(tag.codePointAt(0))
        #         );
        #       }
        # - script:
        #     lang: painless
        #     source: >
        #       if (ctx.meta != null && ctx.meta.parent_tags != null) {
        #         ctx.meta.parent_tags.removeIf(tag ->
        #           tag != null && tag instanceof String && tag.startsWith('*')
        #         );
        #       }
        # remove leading '*' from each tag value (works on arrays too)
        # - gsub:
        #     field: "meta.parent_tags"
        #     pattern: "^\\*"
        #     replacement: ""
        #     ignore_missing: true

        # trim whitespace on each element (optional but nice)
        - trim:
            field: "meta.parent_tags"
            ignore_missing: true

        - html_strip:
            field: "meta.html"
            target_field: "text"
            ignore_missing: true
            if: "ctx.text == null"

  index_templates:
  
    scigma_template_app_v1:
      index_patterns: ["scigma*"]
      priority: 300
      composed_of:
        - ct_ocr_pages_v1
      template:
        # Optional but useful defaults
        settings:
          index:
            knn: true
            mapping:
              ignore_malformed: true
            number_of_shards: 1
            number_of_replicas: 0
            default_pipeline: "ocr_meta_pipeline_v1"
        # aliases:
        #   scigma-all:
        #     is_write_index: false
        #   scigma-complete:
        #     is_write_index: false

    # scigma_template_public_v1:
    #   index_patterns: ["scigma-main-corpus"]
    #   priority: 200
    #   composed_of:
    #     - ct_ocr_pages_v1
    #   template:
    #     # Optional but useful defaults
    #     settings:
    #       index:
    #         knn: false # !!
    #         number_of_shards: 1
    #         number_of_replicas: 1
    #         default_pipeline: "ocr_meta_pipeline_v1"
    #     aliases:
    #       scigma-public:
    #         is_write_index: false
    #         filter:
    #           bool:
    #             must:
    #               - bool:
    #                   should:
    #                     - term:
    #                         meta.parent_tags: "*ingested"
    #                     - term:
    #                         meta.tags: "*ingested"
    #                     - term:
    #                         meta.collection_labels: "ingested"
    #                   minimum_should_match: 1
    #             must_not:
    #               - term:
    #                   meta.parent_tags: "*deprecated"
    #               - term:
    #                   meta.tags: "*deprecated"
    #               - term:
    #                   meta.parent_tags: "*excluded"
    #               - term:
    #                   meta.tags: "*excluded"
  aliases:
    scigma-complete:
      actions:
        - add:
            indices: ["scigma*"]
            alias: scigma-complete

    scigma-public:
      actions:
        - remove:
            index: "scigma*"
            alias: "scigma-public"
            must_exist: false
        - add:
            indices: ["scigma*"]
            alias: scigma-public
            filter:
              bool:
                must:
                  - bool:
                      should:
                        - term:
                            meta.parent_tags: "*ingested"
                        - term:
                            meta.tags: "*ingested"
                        - term:
                            meta.parent_tags: "*public"
                        - term:
                            meta.tags: "*public"
                        - term:
                            meta.collection_labels: "ingested"
                        - term:
                            meta.collection_labels: "public"
                      minimum_should_match: 1
                must_not:
                  - term:
                      meta.parent_tags: "*deprecated"
                  - term:
                      meta.tags: "*deprecated"
                  - term:
                      meta.parent_tags: "*excluded"
                  - term:
                      meta.tags: "*excluded"
                  - term:
                      meta.collection_labels: "excluded"

  # indices:
  #   # Optional bootstrap index. Recommended if you want to write to an alias.
  #   scigma-main-corpus-000001:
  #     aliases:
  #       scigma-main-corpus-write:
  #         is_write_index: true
  #       scigma-main-corpus-read: {}

  plan:
    - put_component_templates:
        - ct_ocr_pages_v1
    - put_index_templates:
        - scigma_template_app_v1
        # - scigma_template_public_v1
    - put_ingest_pipelines: [ocr_meta_pipeline_v1]
    # - create_indices:
    #     - scigma-main-corpus-000001
    - put_aliases: true